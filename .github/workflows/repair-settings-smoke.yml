name: Repair settings smoke synchronization
on:
  push:
    branches: [fix/windows-icon-terminal-tabs]
    paths: [.github/workflows/repair-settings-smoke.yml]
permissions:
  contents: write
concurrency:
  group: repair-settings-smoke
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-icon-terminal-tabs
      - name: Apply exact checked smoke-test changes
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path('scripts/smoke-linux.sh')
          expected = 'dbf5f1aa67ed7d7382c167f1839c0fd72089aaf4'
          actual = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
          assert actual == expected, 'Smoke fixture changed; reconcile rather than overwrite'
          text = path.read_text()

          def replace(before, after):
              global text
              assert text.count(before) == 1, f'Expected one exact replacement: {before!r}'
              text = text.replace(before, after)

          helpers = '''# Read back the focused field before proceeding. A fresh sentinel prevents a
          # previous copy from making an unhandled Ctrl+C look like a successful edit.
          assert_selected_field() {
            put_clipboard kea-settings-field-sentinel
            key ctrl+a ctrl+c
            assert_clipboard "$1"
          }
          # Saving follows asynchronous UI dispatch. Observe the exact persisted
          # value within a bounded wait; never retry the click or rewrite the file.
          assert_file_line() {
            local file="$1" expected="$2"
            for _ in $(seq 1 30); do
              kill -0 "$kea_pid" || return 1
              if [[ -f "$file" ]] && grep -Fqx -- "$expected" "$file"; then return; fi
              sleep .1
            done
            printf 'Expected saved line <%s> in %s; actual contents:\\n' "$expected" "$file" >&2
            if [[ -f "$file" ]]; then cat "$file" >&2; else echo '(file missing)' >&2; fi
            return 1
          }
          '''
          anchor = '# The Composer button stays in the toolbar across resize; a bottom-relative\n'
          replace(anchor, helpers + anchor)
          replace('sleep .5\ngrep -q \'^theme = light$\' "$KEA_SETTINGS"',
                  'assert_file_line "$KEA_SETTINGS" \'theme = light\'')
          replace('''xdotool mousemove --window "$window" "$((WIDTH/2))" 404 click 1
          key ctrl+a
          xdotool type --clearmodifiers 'alt-l'
          xdotool mousemove --window "$window" "$((WIDTH/2))" 311 click 1
          sleep .3
          grep -q '^focus_editor = alt-l$' "$KEA_KEYBINDINGS"''',
                  '''xdotool mousemove --window "$window" "$((WIDTH/2))" 404 click 1
          assert_selected_field ctrl-l
          # Do not race the first input frame or move focus to Save before the
          # component has accepted the complete replacement through real input.
          xdotool type --clearmodifiers --delay 50 'alt-l'
          assert_selected_field alt-l
          import -window "$window" smoke-artifacts/keybindings-edited.png
          xdotool mousemove --window "$window" "$((WIDTH/2))" 311 click 1
          assert_file_line "$KEA_KEYBINDINGS" 'focus_editor = alt-l' ''')
          # Avoid whitespace-only changes from the multiline literal above.
          text = text.replace("assert_file_line \"$KEA_KEYBINDINGS\" 'focus_editor = alt-l' \n",
                              "assert_file_line \"$KEA_KEYBINDINGS\" 'focus_editor = alt-l'\n")
          replace('''xdotool mousemove --window "$window" "$((WIDTH/2))" 404 click 1
          key ctrl+a ctrl+c
          assert_clipboard alt-l''',
                  '''xdotool mousemove --window "$window" "$((WIDTH/2))" 404 click 1
          assert_selected_field alt-l''')
          path.write_text(text)
      - name: Validate and commit only the smoke fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = fix/windows-icon-terminal-tabs
          bash -n scripts/smoke-linux.sh
          git diff --check
          test "$(git diff --name-only)" = scripts/smoke-linux.sh
          git diff -- scripts/smoke-linux.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/smoke-linux.sh
          git commit -m "Synchronize settings smoke input and save assertions without replaying actions"
          git push origin HEAD:refs/heads/fix/windows-icon-terminal-tabs
