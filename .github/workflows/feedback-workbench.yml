name: Feedback workbench
on:
  push:
    branches: [fix/windows-terminal-usability]
permissions:
  contents: write
concurrency:
  group: feedback-workbench
  cancel-in-progress: true
jobs:
  desktop-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-linux
          cache-on-failure: true
      - name: Apply reviewed source changes and format
        run: |
          if test -f scripts/feedback-ui.patch; then
            git apply --recount --check scripts/feedback-ui.patch scripts/feedback-directory.patch
            git apply --recount scripts/feedback-ui.patch scripts/feedback-directory.patch
            rm scripts/feedback-ui.patch scripts/feedback-directory.patch
            python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/smoke-linux.sh')
          t = p.read_text()
          assert '140 200 click 1' in t
          p.write_text(t.replace('140 200 click 1', '140 222 click 1'))
          p = Path('.github/workflows/ci.yml')
          t = p.read_text()
          needle = '      - uses: actions/upload-artifact@v4\n        if: always()'
          assert needle in t
          t = t.replace(needle, "      - name: Direct input and completion acceptance\n        run: timeout 120s xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- bash scripts/smoke-feedback.sh\n" + needle)
          needle = '      - run: cargo build --release --locked -p kea-app'
          assert needle in t
          t = t.replace(needle, '      - run: cargo test --locked -p kea-app\n' + needle + '\n      - run: python scripts/check-windows-subsystem.py target/release/kea.exe')
          p.write_text(t)
          p = Path('docs/editor-integration.md')
          p.write_text(p.read_text() + '\n## Desktop usability updates\n\nSee [Direct input, directory reporting, completion and tail following](windows-feedback.md) for the current interaction contract. Live Direct mode reserves no Kea shortcuts; toolbar controls remain available.\n')
          PY
          fi
          cargo fmt --all
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Apply and format Windows terminal usability fixes'
            git push origin HEAD:fix/windows-terminal-usability
          fi
          mkdir -p feedback-source
          git archive HEAD | tar -x -C feedback-source
      - uses: actions/upload-artifact@v4
        with:
          name: feedback-source
          path: feedback-source/
          include-hidden-files: true
          retention-days: 2
      - name: Install native build and smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-x11-dev libwayland-dev libssl-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libvulkan-dev libclang-dev clang cmake pkg-config xvfb xdotool xclip imagemagick mesa-vulkan-drivers dbus-x11
      - run: cargo test --locked -p kea-core -p kea-document -p kea-alacritty -p kea-pty -p kea-session -p kea-app
      - run: cargo build --locked -p kea-app
      - name: Existing editor and replay acceptance
        run: timeout 120s xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- bash scripts/smoke-linux.sh
      - name: Direct keys and completion acceptance
        run: timeout 120s xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- bash scripts/smoke-feedback.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-smoke
          path: smoke-artifacts/
          retention-days: 2
