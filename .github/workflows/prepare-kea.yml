name: Prepare Kea icon and tabs branch
on:
  push:
    branches: [fix/windows-icon-terminal-tabs]
permissions:
  contents: write
concurrency:
  group: prepare-kea-icon-tabs
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/windows-icon-terminal-tabs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-icon-terminal-tabs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply source changes
        run: |
          python .kea-pr-prepare.py
          sed -i 's/embed-resource = "=3.0.6"/embed-resource = "=3.0.11"/' crates/kea-app/Cargo.toml
      - name: Generate deterministic Windows icon
        run: |
          python scripts/generate-windows-icon.py
          python scripts/generate-windows-icon.py --check
      - name: Resolve build dependency and format source
        run: |
          cargo metadata --format-version 1 > /tmp/kea-metadata.json 2>/tmp/metadata.log || { tail -80 /tmp/metadata.log; exit 1; }
          cargo fmt --all
          git diff --stat
      - name: Commit source on the PR branch only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = fix/windows-icon-terminal-tabs
          # Workflow updates require separate authorized connector writes.
          git restore .github/workflows/ci.yml
          rm .kea-pr-prepare.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "Integrate independent terminal tabs and embedded Windows application icon"
          git push origin HEAD:refs/heads/fix/windows-icon-terminal-tabs
