name: Repair smoke pointer sequencing
on:
  push:
    branches: [fix/windows-icon-terminal-tabs]
    paths: [.github/workflows/repair-smoke-pointer.yml]
permissions:
  contents: write
concurrency:
  group: repair-smoke-pointer
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-icon-terminal-tabs
      - name: Separate pointer motion, press and release in UI fixtures
        shell: python
        run: |
          import re
          import subprocess
          from pathlib import Path

          sources = {
              'scripts/smoke-linux.sh': '7f33860b49330a3c4adc3e2dcfc203de8ddf5d7f',
              'scripts/smoke-tabs.sh': '39344cb5ca11dc31242d8095ec648482122b7ef9',
          }
          for name, expected in sources.items():
              actual = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              assert actual == expected, f'{name} changed; reconcile rather than overwrite'
          helper = Path('scripts/smoke-input.sh')
          assert not helper.exists()
          helper.write_text('''#!/usr/bin/env bash
          # Sourced by the Xvfb smoke fixtures; coordinates are window-relative.
          # Do not batch a pointer warp and an instantaneous click: let the UI
          # dispatch motion and press separately before sending the matching up.
          # Each action is sent exactly once; callers assert the resulting state.
          smoke_click() {
            xdotool mousemove --window "$window" "$1" "$2"
            sleep .15
            xdotool mousedown 1
            sleep .15
            xdotool mouseup 1
            sleep .15
          }
          ''')
          for name in sources:
              path = Path(name)
              text = path.read_text()
              anchor = 'export PYTHONDONTWRITEBYTECODE=1\n'
              assert text.count(anchor) == 1
              text = text.replace(anchor, anchor + 'source scripts/smoke-input.sh\n')
              text, count = re.subn(r'xdotool mousemove --window "\$window" ([^\n]+?) click 1\b',
                                    r'smoke_click \1', text)
              assert count > 0
              print(f'{name}: sequenced {count} UI clicks; drag and wheel fixtures unchanged')
              path.write_text(text)
      - name: Validate and commit only the smoke input changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = fix/windows-icon-terminal-tabs
          bash -n scripts/smoke-input.sh scripts/smoke-linux.sh scripts/smoke-tabs.sh
          git diff --check
          git diff -- scripts/smoke-linux.sh scripts/smoke-tabs.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/smoke-input.sh scripts/smoke-linux.sh scripts/smoke-tabs.sh
          git commit -m "Sequence smoke pointer motion and press/release without replaying clicks"
          git push origin HEAD:refs/heads/fix/windows-icon-terminal-tabs
