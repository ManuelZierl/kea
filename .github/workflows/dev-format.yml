name: Dev Format Apply
on:
  push:
    branches: [feature/document-input-keybindings]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/kea-app/src/command_editor.rs crates/kea-app/src/keybindings.rs crates/kea-app/src/main.rs
          git commit -m "Format document input implementation"
          git push
