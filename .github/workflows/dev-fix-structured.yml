name: Dev Fix Structured Document
on:
  push:
    branches: [feature/structured-document-blocks]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply correctness fixes
        shell: python
        run: |
          from pathlib import Path

          main = Path('crates/kea-app/src/main.rs')
          text = main.read_text()
          if not text.startswith('#![recursion_limit = "256"]'):
              main.write_text('#![recursion_limit = "256"]\n' + text)

          doc = Path('crates/kea-document/src/lib.rs')
          text = doc.read_text()
          start = text.index('fn base64_decode(input: &str) -> Option<Vec<u8>> {')
          end = text.index('\nfn base64_value', start)
          replacement = r'''fn base64_decode(input: &str) -> Option<Vec<u8>> {
              if !input.len().is_multiple_of(4) {
                  return None;
              }
              let (chunks, remainder) = input.as_bytes().as_chunks::<4>();
              if !remainder.is_empty() {
                  return None;
              }
              let mut out = Vec::with_capacity(chunks.len() * 3);
              for (index, chunk) in chunks.iter().enumerate() {
                  let last = index + 1 == chunks.len();
                  let a = base64_value(chunk[0])?;
                  let b = base64_value(chunk[1])?;
                  match (chunk[2], chunk[3]) {
                      (b'=', b'=') => {
                          if !last || b & 0x0f != 0 {
                              return None;
                          }
                          out.push((a << 2) | (b >> 4));
                      }
                      (b'=', _) => return None,
                      (c, b'=') => {
                          if !last {
                              return None;
                          }
                          let c = base64_value(c)?;
                          if c & 0x03 != 0 {
                              return None;
                          }
                          out.push((a << 2) | (b >> 4));
                          out.push((b << 4) | (c >> 2));
                      }
                      (c, d) => {
                          let c = base64_value(c)?;
                          let d = base64_value(d)?;
                          out.push((a << 2) | (b >> 4));
                          out.push((b << 4) | (c >> 2));
                          out.push((c << 6) | d);
                      }
                  }
              }
              Some(out)
          }
          '''
          text = text[:start] + replacement + text[end:]
          needle = '''    #[test]\n    fn local_queue_applies_command_validation() {'''
          strict_test = '''    #[test]\n    fn malformed_base64_markers_are_rejected() {\n        for malformed in ["=AAA", "AA=A", "AA==AAAA", "AB==", "AAB="] {\n            assert!(base64_decode(malformed).is_none(), "accepted {malformed}");\n        }\n    }\n\n'''
          if 'fn malformed_base64_markers_are_rejected()' not in text:
              text = text.replace(needle, strict_test + needle)
          doc.write_text(text)

          shell = Path('crates/kea-app/src/shell.rs')
          text = shell.read_text()
          old = '''[Console]::Write([char]27 + ']777;kea;start;{id};{encoded}' + [char]7); $global:LASTEXITCODE=$null; Invoke-Expression {quoted}; $__kea_ok=$?; $__kea_native=$LASTEXITCODE; $__kea_status=if ($__kea_ok) {{ if ($null -ne $__kea_native) {{ [int]$__kea_native }} else {{ 0 }} }} else {{ if ($null -ne $__kea_native -and [int]$__kea_native -ne 0) {{ [int]$__kea_native }} else {{ 1 }} }}; [Console]::Write([char]27 + ']777;kea;done;{id};' + $__kea_status + [char]7)\\r'''
          new = '''[Console]::Write([char]27 + ']777;kea;start;{id};{encoded}' + [char]7); $__kea_previous=$global:LASTEXITCODE; $global:LASTEXITCODE=$null; Invoke-Expression {quoted}; $__kea_ok=$?; $__kea_native=$global:LASTEXITCODE; $__kea_status=if ($__kea_ok) {{ if ($null -ne $__kea_native) {{ [int]$__kea_native }} else {{ 0 }} }} else {{ if ($null -ne $__kea_native -and [int]$__kea_native -ne 0) {{ [int]$__kea_native }} else {{ 1 }} }}; if ($null -eq $__kea_native) {{ $global:LASTEXITCODE=$__kea_previous }}; [Console]::Write([char]27 + ']777;kea;done;{id};' + $__kea_status + [char]7)\\r'''
          if old not in text:
              raise SystemExit('PowerShell wrapper pattern changed')
          text = text.replace(old, new)
          if 'preserves the previous native exit code' not in text:
              marker = '        assert!(wrapper.contains("done;9"));\n'
              text = text.replace(marker, marker + '        assert!(wrapper.contains("$__kea_previous=$global:LASTEXITCODE"));\n        assert!(wrapper.contains("$global:LASTEXITCODE=$__kea_previous")); // preserves the previous native exit code\n')
          shell.write_text(text)
      - run: cargo fmt --all
      - name: Commit fixes if needed
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/kea-app/src/main.rs crates/kea-app/src/shell.rs crates/kea-document/src/lib.rs
          git commit -m "Harden document protocol and app compilation"
          git push
