name: CI
on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: python scripts/generate-windows-icon.py --check
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p kea-core -p kea-alacritty -p kea-pty -p kea-session -p kea-document
      - run: cargo clippy --locked -p kea-core -p kea-alacritty -p kea-pty -p kea-session -p kea-document --all-targets -- -D warnings
      - name: Build macOS release binary
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest'
        run: cargo build --release --locked -p kea-app
      - name: Package macOS release binary
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          architecture="$(uname -m)"
          archive="kea-${GITHUB_REF_NAME}-macos-${architecture}.tar.gz"
          mkdir -p dist/package
          cp target/release/kea dist/package/kea
          cp LICENSE README.md CHANGELOG.md dist/package/
          tar -czf "dist/${archive}" -C dist/package .
          rm -rf dist/package
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest'
        with:
          name: kea-release-macos-${{ runner.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
  desktop-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-linux
          cache-on-failure: true
      # The coordinate-based smoke fixture uses GPUI's Ubuntu UI font metrics.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-x11-dev libwayland-dev libssl-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libvulkan-dev libclang-dev clang cmake pkg-config xvfb xdotool xclip imagemagick mesa-vulkan-drivers dbus-x11 fonts-ubuntu
      - run: cargo test --locked -p kea-app
      - run: bash scripts/test-reverse-search-core.sh
      - run: cargo build --locked -p kea-app
      - name: Build Linux release binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo build --release --locked -p kea-app
      - name: Independent terminal tab acceptance
        shell: bash
        run: |
          set -euo pipefail
          lvp_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test -e "${lvp_icds[0]}"
          env -u WAYLAND_DISPLAY -u DISPLAY \
            MESA_VK_WSI_FORCE_SW=1 \
            VK_ICD_FILENAMES="${lvp_icds[0]}" \
            LIBGL_ALWAYS_SOFTWARE=1 \
            timeout 90s xvfb-run -a -s '-screen 0 1280x900x24 +extension DRI3' \
            dbus-run-session -- bash scripts/smoke-tabs.sh
      - name: Shared terminal/editor acceptance
        shell: bash
        run: |
          set -euo pipefail
          lvp_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test -e "${lvp_icds[0]}"
          env -u WAYLAND_DISPLAY -u DISPLAY \
            MESA_VK_WSI_FORCE_SW=1 \
            VK_ICD_FILENAMES="${lvp_icds[0]}" \
            LIBGL_ALWAYS_SOFTWARE=1 \
            timeout 180s xvfb-run -a -s '-screen 0 1280x900x24 +extension DRI3' \
            dbus-run-session -- bash scripts/smoke-linux.sh
      - name: Package Linux release binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          archive="kea-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          mkdir -p dist/package
          cp target/release/kea dist/package/kea
          cp LICENSE README.md CHANGELOG.md dist/package/
          tar -czf "dist/${archive}" -C dist/package .
          rm -rf dist/package
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: kea-release-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kea-build-metadata
          path: |
            Cargo.lock
            smoke-artifacts/
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-windows
          cache-on-failure: true
      - run: cargo test --locked -p kea-app
      - run: cargo build --release --locked -p kea-app
      - name: Verify icon source and embedded native icon
        run: |
          python scripts/generate-windows-icon.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-windows-icon.py target/release/kea.exe
      - name: Verify Windows GUI subsystem
        run: python scripts/verify-windows-subsystem.py target/release/kea.exe
      - name: Package Windows release binary
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item target/release/kea.exe dist/package/kea.exe
          Copy-Item LICENSE,README.md,CHANGELOG.md dist/package/
          $archive = "dist/kea-$env:GITHUB_REF_NAME-windows-x86_64.zip"
          Compress-Archive -Path dist/package/* -DestinationPath $archive
          Remove-Item -Recurse -Force dist/package
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: kea-release-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: kea-windows-x86_64
          path: target/release/kea.exe
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [engine, desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag version and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          git merge-base --is-ancestor "$tag_commit" origin/main || {
            echo "Release tag $GITHUB_REF_NAME is not reachable from origin/main." >&2
            exit 1
          }
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kea-app") | .version')"
          test "$GITHUB_REF_NAME" = "v${version}" || {
            echo "Release tag $GITHUB_REF_NAME does not match workspace version v${version}." >&2
            exit 1
          }
      - uses: actions/download-artifact@v4
        with:
          pattern: kea-release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" "${release_flags[@]}"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
              --generate-notes --notes-file CHANGELOG.md \
              --title "Kea $GITHUB_REF_NAME" "${release_flags[@]}"
          fi
