name: Dev Apply Structured Document
on:
  push:
    branches: [feature/structured-document-blocks]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply source payload
        shell: bash
        run: |
          cat .kea-dev-payload/part* | base64 -d > /tmp/kea-structured.tar.gz
          tar -xzf /tmp/kea-structured.tar.gz
          chmod +x scripts/smoke-linux.sh
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - name: Commit implementation and remove bootstrap payload
        shell: bash
        run: |
          git rm -r .kea-dev-payload .github/workflows/dev-apply-structured.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Implement persistent command/output document blocks"
          git push
