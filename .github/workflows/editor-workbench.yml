name: Editor workbench
on:
  push:
    branches: [feature/platform-editor]
    paths:
      - '.github/workflows/editor-workbench.yml'
      - 'Cargo.toml'
      - 'crates/kea-app/**'
permissions:
  contents: write
concurrency:
  group: editor-workbench
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-linux
          cache-on-failure: true
      - name: Resolve lockfile and format
        run: |
          cargo metadata --format-version 1 > /tmp/kea-metadata.json
          cargo fmt --all
          git add Cargo.lock 'crates/kea-app/*.toml' 'crates/kea-app/src/*.rs'
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Lock and format platform editor integration'
            git push origin HEAD:feature/platform-editor
          fi
      - name: Export source for review
        run: |
          mkdir -p editor-review/dependencies
          git archive HEAD | tar -x -C editor-review
          python3 - <<'PY'
          import json, pathlib, shutil
          for package in json.load(open('/tmp/kea-metadata.json'))['packages']:
              if package['name'] in ('gpui', 'gpui-component'):
                  root = pathlib.Path(package['manifest_path']).parent
                  dst = pathlib.Path('editor-review/dependencies') / package['name']
                  for source in root.rglob('*'):
                      if source.is_file() and source.suffix in ('.rs', '.toml'):
                          target = dst / source.relative_to(root)
                          target.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copyfile(source, target)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: editor-source
          path: editor-review/
          include-hidden-files: true
          retention-days: 2
      - name: Install desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-x11-dev libwayland-dev libssl-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libvulkan-dev libclang-dev clang cmake pkg-config
      - name: Build editor dependencies
        run: cargo build --locked -p gpui-component
