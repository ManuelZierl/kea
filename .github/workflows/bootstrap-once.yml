# One-time bootstrap housekeeping. The successful job removes this workflow.
name: Bootstrap metadata
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  finalize:
    if: >-
      github.event.head_commit.message == 'chore: finalize bootstrap metadata'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format sources, lock dependencies, and remove bootstrap workflow
        run: |
          cargo generate-lockfile
          cargo fmt --all
          git rm .github/workflows/bootstrap-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates
          git commit -m 'chore: format Rust sources and lock bootstrap dependencies'
          git push origin HEAD:main
