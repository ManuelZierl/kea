name: Shared session workbench
on:
  push:
    branches: [fix/shared-session-input]
    paths: ['.github/workflows/shared-session-workbench.yml', '.kea-work/**']
permissions:
  contents: write
concurrency:
  group: shared-session-workbench
  cancel-in-progress: true
jobs:
  desktop-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-linux
          cache-on-failure: true
      - name: Apply verified source changes
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess, shutil
          root = pathlib.Path('.')
          payload = ''.join(p.read_text() for p in sorted(root.glob('.kea-work/part-*')))
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '8600a39d1f5a0cba095d76a80b267fc24fa90f2eef79337390bd01c5faa7c5f5'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          pathlib.Path('scripts/smoke-linux.sh').write_text('#!/usr/bin/env bash\nset -euo pipefail\nexec bash "$(dirname "$0")/smoke-shared-session.sh"\n')
          p = pathlib.Path('.github/workflows/ci.yml')
          text = p.read_text().replace('timeout 120s xvfb-run', 'timeout 180s xvfb-run').replace('1280x800x24', '1280x900x24')
          text = text.replace('      - run: cargo build --release --locked -p kea-app\n', '      - run: cargo build --release --locked -p kea-app\n      - name: Verify Windows GUI subsystem\n        run: python scripts/verify-windows-subsystem.py target/release/kea.exe\n')
          p.write_text(text)
          p = pathlib.Path('README.md')
          text = p.read_text()
          text = text.replace('Write commands as ordinary multiline text, explicitly execute them, and inspect their output as document blocks. A real PTY stays underneath for existing terminal applications.', 'The live terminal and bottom text editor are available together. Write multiline input in the editor or click the terminal to interact directly. Command blocks are an optional view, not a requirement for using Kea.')
          start = text.index('For OpenCode, Vim, `less`, SSH or a REPL, switch to')
          end = text.index('\n\n', start)
          text = text[:start] + 'For OpenCode, Vim, `less`, SSH or a REPL, click the terminal: its keystrokes belong to the child application. The bottom editor remains available for composing text. Use Show blocks to inspect tracked commands alongside the terminal. These are views of one process, never separate shells. See [shared session and input ownership](docs/shared-session.md).' + text[end:]
          text = text.replace('| Toggle Document / Direct PTY |', '| Change composer submission target |')
          text = text.replace('| Copy whole document / terminal screen |', '| Complete single-line draft (handoff, no Enter) | Ctrl+Space | Ctrl+Space |\n| Show / hide optional blocks | Ctrl+Shift+B | Ctrl+Shift+B |\n| Copy whole document / terminal screen |')
          start = text.index('Editing shortcuts apply to the focused text component.')
          end = text.index('\n\n', start)
          text = text[:start] + 'The table applies to editor/history focus. With a live terminal focused, Kea does not reserve these shortcuts: Ctrl+C/V/Z/L, Tab and F6–F10 go to the terminal application. Use the clickable toolbar to focus the editor, paste to the terminal, copy all, or inspect history. OS-reserved shortcuts and unsupported extended terminal protocols remain platform/compatibility limitations.' + text[end:]
          text = text.replace('output_wrap = true\n', 'output_wrap = true\nshow_blocks = false\n')
          text = text.replace('`focus_editor`, `toggle_direct`,', '`focus_editor`, `complete`, `toggle_blocks`, `toggle_direct` (also `toggle_input_target`),')
          text = text.replace('Working directory/environment metadata is not fabricated when no explicit adapter data exists.', 'The status bar shows the last directory explicitly reported by the shell at startup and around managed command submissions. Direct terminal commands and remote shells can make that report stale; it is labeled last reported, not guessed from prompts.')
          p.write_text(text)
          p = pathlib.Path('AGENTS.md')
          text = p.read_text().replace('Read README.md, docs/architecture.md and docs/editor-integration.md before changing the design.', 'Read README.md, docs/architecture.md, docs/editor-integration.md and docs/shared-session.md before changing the design.')
          text = text.replace('- Direct PTY and Document mode refer to the same process/session. Do not silently spawn a second shell.', '- The live terminal and composer coexist over the same process. Blocks are an optional projection, not an exclusive operating mode. Never silently spawn a second shell.\n- All Kea accelerators are masked with live-terminal focus. The composer owns normal editing; toolbar controls provide access without reserving child keys.\n- After unmanaged terminal input, shell ownership is unknown: composer sends literal application text, never eval wrappers. Explicitly restore managed shell submission only after returning to the shell.\n- Completion handoff uses the running application\'s Tab behavior and does not send Enter. Refuse multiline/control-character completion drafts rather than executing them.')
          p.write_text(text)
          for name in ('docs/architecture.md', 'docs/editor-integration.md'):
              p = pathlib.Path(name)
              text = p.read_text()
              line = text.find('\n')
              text = text[:line+1] + '\n## Shared-session interaction\n\nThe terminal and bottom editor now coexist; command blocks are optional. Submission target is distinct from focus and output presentation. Live-terminal focus masks Kea shortcuts; normal editing remains with the focused editor. See [shared-session input ownership, completion and directory reporting](shared-session.md) for the current contract. Earlier Document/Direct terminology below describes projections, not mutually exclusive UI modes.\n' + text[line+1:]
              text = text.replace('The compatibility terminal retains its ANSI palette and current fixed metrics.', 'The compatibility terminal retains its ANSI palette and fixed cell metrics, but is resized from its actual rendered viewport.')
              p.write_text(text)
          shutil.rmtree('.kea-work')
          pathlib.Path('.github/workflows/shared-session-workbench.yml').unlink()
          PY
          cargo fmt --all
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Unify terminal and composer input with optional blocks and Windows fixes'
          git push origin HEAD:fix/shared-session-input
      - name: Export exact reviewed source
        run: |
          mkdir -p shared-source
          git archive HEAD | tar -x -C shared-source
          git rev-parse HEAD > shared-source/VALIDATED_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shared-session-source
          path: shared-source/
          include-hidden-files: true
          retention-days: 3
      - name: Install desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-x11-dev libwayland-dev libssl-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libvulkan-dev libclang-dev clang cmake pkg-config xvfb xdotool xclip imagemagick mesa-vulkan-drivers dbus-x11
      - name: Portable tests
        run: cargo test --locked -p kea-core -p kea-document -p kea-alacritty -p kea-pty -p kea-session
      - name: App tests and build
        run: |
          cargo test --locked -p kea-app
          cargo build --locked -p kea-app
      - name: Shared-session graphical acceptance
        run: timeout 180s xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- bash scripts/smoke-linux.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-session-smoke
          path: smoke-artifacts/
          retention-days: 3
