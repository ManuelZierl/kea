[workspace]
members = ["crates/kea-core", "crates/kea-alacritty", "crates/kea-pty", "crates/kea-session", "crates/kea-document", "crates/kea-app"]
exclude = ["vendor/gpui-component"]
default-members = ["crates/kea-app"]
resolver = "2"

[workspace.package]
version = "0.0.1-alpha.2"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
kea-core = { path = "crates/kea-core" }
kea-alacritty = { path = "crates/kea-alacritty" }
kea-pty = { path = "crates/kea-pty" }
kea-session = { path = "crates/kea-session" }
kea-document = { path = "crates/kea-document" }
alacritty_terminal = "=0.26.0"
portable-pty = "=0.9.0"
gpui = "=0.2.2"
anyhow = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"
