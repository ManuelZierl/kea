[package]
name = "kea-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kea"
path = "src/main.rs"

[dependencies]
kea-core.workspace = true
kea-alacritty.workspace = true
kea-session.workspace = true
kea-document.workspace = true
gpui.workspace = true
gpui-component = { path = "../../vendor/gpui-component", version = "=0.5.1", default-features = false }
gpui-component-assets = "=0.5.1"
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tree-sitter-bash = "=0.23.3"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
